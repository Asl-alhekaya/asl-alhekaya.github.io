# Installed into the Pages repo (asl-alhekaya.github.io) as .github/workflows/site.yml by studio/site/cloud/install_pages.py.
# ADR-008: the public site rebuilds in the cloud, with the PC off. Source of truth = data/episodes-public.json in THIS repo,
# written by the cloud publish stage (deploy key) as "pending" and promoted here when YouTube shows the video publicly.
name: site
on:
  push:
    branches: [main]
    paths: ["data/**"]
  schedule:
    - cron: "23 */2 * * *"   # every two hours (UTC): a video the owner flips to public in YouTube Studio reaches the site by itself
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: site
  cancel-in-progress: false
env:
  TZ: Asia/Kuwait
  ASL_SITE_FFMPEG: none   # covers and icons are already committed; the cloud build converts nothing
  ASL_SITE_DATA: ${{ github.workspace }}/data/episodes-public.json
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Promote pending episodes and render the site
        run: python -X utf8 tools/build_site.py "$GITHUB_WORKSPACE" --promote
      - name: Commit what changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(git status --porcelain | sed 's/^...//')
          if [ -z "$changed" ]; then echo "nothing changed"; exit 0; fi
          if [ "$changed" = "sitemap.xml" ]; then git checkout -- sitemap.xml; echo "only the build date moved"; exit 0; fi
          git config user.name "asl-site"
          git config user.email "asl-site@users.noreply.github.com"
          git add -A
          git commit -q -m "Site: cloud rebuild $(date +%F-%H%M)"
          for i in 1 2 3; do
            git push -q origin HEAD:main && break
            git pull -q --rebase origin main
          done
          # Pages (branch source) normally rebuilds on this push by itself; ask once more, never fail the run on it
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || true
